<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>TrueTrading — Canal de Telegram</title>
<meta name="theme-color" content="#121212" />
<link rel="icon" type="image/png" href="/favicon.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TrueTrading — Canal de Telegram" />
<meta property="og:description" content="Entra al canal privado de TrueTrading en Telegram." />
<meta property="og:image" content="https://www.truetrading.es/logo.png" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#121212;color:#fff;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:420px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 22px;display:block}
  h1{font-size:22px;line-height:1.25;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
  p.sub{font-size:14px;line-height:1.55;color:rgba(255,255,255,.62);margin:0 0 26px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:16px 22px;border-radius:9999px;border:none;font-size:15px;font-weight:700;
    text-decoration:none;cursor:pointer;font-family:inherit;
    transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 140ms}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:#10B981;color:#000;
    box-shadow:0 0 0 1px rgba(16,185,129,.35),0 4px 24px rgba(16,185,129,.3)}
  .btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);margin-top:12px}
  .steps{margin:26px 0 0;padding:18px 18px 16px;border-radius:16px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);text-align:left}
  .steps h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:#10B981;margin:0 0 12px}
  .steps ol{margin:0;padding-left:20px}
  .steps li{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.8);margin-bottom:7px}
  .steps li:last-child{margin-bottom:0}
  .steps b{color:#fff;font-weight:600}
  .foot{margin-top:22px;font-size:11.5px;color:rgba(255,255,255,.32);line-height:1.5}
  .foot a{color:rgba(255,255,255,.5)}
  .spinner{width:26px;height:26px;margin:0 auto;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.14);border-top-color:#10B981;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/logo.png" alt="TrueTrading" />

    <!-- Navegador normal: redirect directo -->
    <section id="auto">
      <h1>Abriendo Telegram…</h1>
      <p class="sub">Te estamos llevando al canal de TrueTrading.</p>
      <div class="spinner"></div>
      <p class="foot" style="margin-top:20px">¿No se abre? <a id="autoLink" href="#">Toca aquí</a></p>
    </section>

    <!-- Navegador embebido (TikTok, Instagram…) -->
    <section id="inapp" hidden>
      <h1 id="title">Únete al canal de Telegram</h1>
      <p class="sub" id="sub">Un toque y estás dentro.</p>

      <a class="btn btn-primary" id="openBtn" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 20c-.25 1.1-.9 1.37-1.83.85l-5.05-3.72-2.44 2.35c-.27.27-.5.5-1.02.5l.36-5.15L17.99 6.4c.4-.36-.09-.56-.63-.2L5.78 13.5.83 11.95c-1.08-.34-1.1-1.08.22-1.6L20.5 2.78c.9-.33 1.68.2 1.4 1.52Z"/></svg>
        <span id="openBtnLabel">Abrir en Telegram</span>
      </a>

      <button class="btn btn-ghost" id="copyBtn" type="button" hidden>
        <span id="copyLabel">Copiar enlace</span>
      </button>

      <div class="steps" id="steps" hidden>
        <h2 id="stepsTitle">Si no se abre</h2>
        <ol id="stepsList"></ol>
      </div>

      <p class="foot">
        <a id="hintLink" href="#" hidden>No se abre / no tengo Telegram</a>
        <span id="footNote">Canal privado de TrueTrading en Telegram.</span>
      </p>
    </section>
  </main>

<script>
(function () {
  var INVITE   = 'fM4O7FhDgnYxNjM0';
  var HTTPS    = 'https://t.me/+' + INVITE;                  // Universal Link (fuera de webviews)
  var TG       = 'tg://join?invite=' + INVITE;               // Esquema nativo (toque del usuario)
  var INTENT   = 'intent://join?invite=' + INVITE +
                 '#Intent;scheme=tg;S.browser_fallback_url=' + encodeURIComponent(HTTPS) + ';end';
  var STORE_IOS = 'https://apps.apple.com/app/telegram-messenger/id686449807';

  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var isTikTok    = /BytedanceWebview|musical_ly|Bytelo|trill|aweme|TikTok/i.test(ua);
  var isInstagram = /Instagram/i.test(ua);
  var isFacebook  = /FBAN|FBAV|FB_IAB/i.test(ua);
  var isOtherIAB  = /Line\/|Snapchat|Twitter|WhatsApp|Pinterest|LinkedInApp|MicroMessenger/i.test(ua);
  var inApp = isTikTok || isInstagram || isFacebook || isOtherIAB;

  function $(id) { return document.getElementById(id); }

  // ── Navegador real (Safari, Chrome…): el Universal Link funciona ──
  if (!inApp) {
    $('autoLink').href = HTTPS;
    setTimeout(function () { location.replace(HTTPS); }, 60);
    return;
  }

  // ── Dentro de un webview embebido ──
  $('auto').hidden = true;
  $('inapp').hidden = false;

  var appName = isTikTok ? 'TikTok' : isInstagram ? 'Instagram' : isFacebook ? 'Facebook' : 'esta app';
  var list = $('stepsList');

  function addStep(html) {
    var li = document.createElement('li');
    li.innerHTML = html;
    list.appendChild(li);
  }

  // ¿El usuario ha salido de la página? Entonces la app se abrió.
  var left = false;
  function markLeft() { left = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) markLeft(); });
  window.addEventListener('pagehide', markLeft);

  // Plan B: sólo aparece cuando el intento falla de verdad.
  var fallbackShown = false;
  function showFallback() {
    if (fallbackShown) return;
    fallbackShown = true;

    $('title').textContent = appName + ' está bloqueando Telegram';
    $('sub').textContent = 'Su navegador interno no puede abrir apps. Sal de él y entras al instante:';
    $('openBtnLabel').textContent = 'Reintentar abrir Telegram';
    $('openBtn').className = 'btn btn-ghost';
    $('hintLink').hidden = true;
    $('footNote').hidden = false;
    $('footNote').innerHTML = '¿No tienes Telegram? <a href="' + STORE_IOS + '">Descárgalo aquí</a>';

    list.innerHTML = '';
    if (isIOS) {
      addStep('Toca el icono <b>“…”</b> o la <b>flecha</b> de la esquina de la pantalla.');
      addStep('Elige <b>“Abrir en el navegador”</b> / <b>“Abrir en Safari”</b>.');
      addStep('Esta página se abrirá en Safari y <b>Telegram se abrirá solo</b>.');
    } else {
      addStep('Toca los <b>tres puntos (⋮)</b> arriba a la derecha.');
      addStep('Elige <b>“Abrir en el navegador”</b>.');
      addStep('En Chrome, Telegram se abrirá solo.');
    }
    $('steps').hidden = false;
    $('copyBtn').hidden = false;
    $('inapp').insertBefore($('steps'), $('openBtn'));
    $('steps').style.margin = '0 0 20px';
  }

  // Android → intent:// (lo resuelve el SO, no el webview).
  // iOS     → tg:// mediante toque real: los redirects por JS los bloquea Apple.
  $('openBtn').setAttribute('href', isAndroid ? INTENT : TG);
  $('openBtn').setAttribute('rel', 'noopener');

  if (isIOS) {
    $('sub').textContent = 'Pulsa el botón para abrir el canal en tu Telegram.';
    $('hintLink').hidden = false;
    $('footNote').hidden = true;
  }

  $('openBtn').addEventListener('click', function () {
    setTimeout(function () {
      if (left || document.hidden) return;   // la app se abrió
      showFallback();
    }, isIOS ? 1500 : 1200);
  });

  $('hintLink').addEventListener('click', function (e) { e.preventDefault(); showFallback(); });

  // ── Copiar enlace, con fallback para webviews sin Clipboard API ──
  $('copyBtn').addEventListener('click', function () {
    var original = $('copyLabel').textContent;
    function done() {
      $('copyLabel').textContent = '¡Enlace copiado!';
      setTimeout(function () { $('copyLabel').textContent = original; }, 2200);
    }
    function legacyCopy() {
      var ta = document.createElement('textarea');
      ta.value = HTTPS;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:absolute;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); done(); }
      catch (e) { $('copyLabel').textContent = HTTPS; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(HTTPS).then(done, legacyCopy);
    } else { legacyCopy(); }
  });
})();
</script>
</body>
</html>
