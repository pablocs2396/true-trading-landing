  <head>

    <!-- Primary SEO -->

    <!-- JSON-LD: MobileApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "TrueTrading",
      "description": "App de trading con señales verificadas de Forex e índices, formación por niveles con acceso por mérito, diario de operaciones con Myfxbook y comunidad de traders.",
      "url": "https://truetrading.app/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1200"
      },
      "publisher": {
        "@type": "Organization",
        "name": "TrueTrading",
        "url": "https://truetrading.app/"
      },
      "featureList": [
        "Señales de trading en tiempo real con entrada, take profit y stop loss",
        "Acceso a señales por mérito: se desbloquea completando formación",
        "Formación en trading: fundamentos, análisis técnico y gestión del riesgo",
        "Diario de trading sincronizado con Myfxbook",
        "Ranking de comunidad basado en racha diaria de constancia"
      ]
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TrueTrading",
      "url": "https://truetrading.app/",
      "logo": "https://truetrading.app/icon.png",
      "description": "Plataforma de trading que combina señales verificadas, formación y comunidad. El acceso a las señales se gana completando cursos, no se compra.",
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: FAQPage (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Es gratuita la app de TrueTrading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, TrueTrading es gratuita para descargar en iOS y Android. El acceso a señales, formación y comunidad está incluido sin coste."
          }
        },
        {
          "@type": "Question",
          "name": "¿Por qué necesito completar cursos antes de acceder a las señales de trading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Porque operar sin entender el riesgo es peligroso. En TrueTrading las señales son útiles solo si el trader sabe interpretarlas. Por eso el acceso se gana completando formación, no se compra."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué mercados analiza TrueTrading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TrueTrading analiza principalmente Forex (pares de divisas), índices bursátiles y materias primas. Las señales incluyen dirección, entrada, take profit y stop loss con estado en tiempo real."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona el Diario de Trading en TrueTrading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Conecta tu cuenta de Myfxbook y tus operaciones se sincronizan automáticamente. Verás tu win rate, pips totales, historial y estadísticas detalladas de tu rendimiento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es la racha diaria en TrueTrading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La racha mide los días consecutivos que accedes a la app. Es un recordatorio de que la constancia es parte del trading. Los traders con más racha aparecen en el ranking de la comunidad."
          }
        }
      ]
    }
    </script>

    <!-- JSON-LD: WebSite (AEO — sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TrueTrading",
      "url": "https://truetrading.app/",
      "description": "App gratuita de trading con señales verificadas de Forex e índices, formación por niveles y diario de operaciones.",
      "inLanguage": "es",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://truetrading.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
